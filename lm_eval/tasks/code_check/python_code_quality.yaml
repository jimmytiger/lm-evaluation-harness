task: python_code_quality
custom_dataset: !function utils.load_dataset
process_docs: !function utils.process_docs
output_type: generate_until
test_split: test
doc_to_text: |
  Problem: {{problem}}
  
  Description: {{description}}
  
  Write a Python function that solves this problem. Your code should:
  - Be syntactically correct
  - Pass all test cases
  - Follow good coding practices (proper naming, comments/docstrings, error handling)
  - Be readable and well-structured
  
  Test cases your function should pass:
  {% for test in test_cases %}
  - {{test}}
  {% endfor %}
  
  Please provide ONLY your function implementation (no test cases, no explanations):

doc_to_target: "{{expected_solution}}"
metric_list:
  - metric: !function utils.code_quality_score
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.functional_correctness
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.syntax_validity
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.code_style_score
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until: []
  max_gen_toks: 1024
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 1
filter_list:
  - name: "extract_code"
    filter:
      - function: "custom"
        filter_fn: !function utils.build_predictions
metadata:
  version: 1.0
  description: "Evaluates Python code quality generated by LLMs on simple programming problems"
  author: "LM Evaluation Harness"
  tags:
    - code_generation
    - python
    - code_quality
    - programming